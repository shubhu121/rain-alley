<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1217">
  <title>Rain Alley · Shinjuku, Tokyo</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1217;
      color: #f0eee5
    }

    body {
      font-family: "Inter", "Segoe UI", sans-serif
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab
    }

    #scene:active {
      cursor: grabbing
    }

    body.quiet #scene {
      cursor: none
    }

    #controls {
      position: absolute;
      inset: auto 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 60px max(25px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(26px, env(safe-area-inset-left));
      background: linear-gradient(transparent, rgba(2, 6, 9, .58));
      transition: opacity .7s;
      pointer-events: none;
    }

    .quiet #controls {
      opacity: 0
    }

    #controls:focus-within {
      opacity: 1
    }

    .location {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 36px;
      text-shadow: 0 1px 5px #000
    }

    .location [lang] {
      font: 15px/1.2 "Yu Mincho", "Hiragino Mincho ProN", serif;
      letter-spacing: .08em
    }

    .place {
      border-left: 1px solid #b8b9b48f;
      padding-left: 12px;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 550
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: auto
    }

    button {
      background: #0a10145c;
      color: inherit;
      width: 36px;
      height: 36px;
      border: 1px solid #e3eae12b;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0
    }

    button:hover,
    button:focus-visible {
      background: #182025df;
      border-color: #eeeee69a;
      outline: none
    }

    button svg {
      width: 15px;
      height: 15px;
      fill: currentColor
    }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 30px;
      text-align: center;
      font-size: 14px;
      letter-spacing: .04em;
      background: #10181d
    }

    #status[hidden], button[hidden] {
      display: none
    }

    @media(max-width:520px) {
      #controls {
        padding: 45px 16px max(18px, env(safe-area-inset-bottom))
      }

      .location {
        gap: 8px
      }

      .place {
        font-size: 8px;
        padding-left: 8px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      #controls {
        transition: none
      }
    }
  </style>
</head>

<body>
  <canvas id="scene"
    aria-label="A first-person walk through a rainy alley in Shinjuku, Tokyo. Drag to look around. Space pauses the walk."></canvas>
  <div id="controls">
    <div class="location"><span lang="ja">雨の横丁</span><span class="place">Shinjuku, Tokyo</span></div>
    <div class="actions">
      <button id="play" type="button" title="Pause walk (Space)" aria-label="Pause walk"><svg viewBox="0 0 16 16"
          aria-hidden="true">
          <path id="playIcon" d="M3.5 2.5h3v11h-3zm6 0h3v11h-3z" />
        </svg></button>
      <button id="fullscreen" type="button" title="Full screen (F)" aria-label="Enter full screen"><svg
          viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 6V2h4m4 0h4v4m0 4v4h-4m-4 0H2v-4" fill="none" stroke="currentColor" stroke-width="1.35"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg></button>
    </div>
  </div>
  <div id="status" role="status">Opening the alley…</div>

// Every printed surface, down to the labels on the bottles, is drawn locally.
const shops=[

  [mirror.t,noiseMap,stoneMap,lightMap,roadMap,coverMap].forEach((t,i)=>bindTexture(i,t));gl.drawArrays(gl.TRIANGLES,0,6);
  glazing(c);steam(c,time,47);
  cameraUniforms(rainProg,c);passLights(rainProg);gl.uniform1f(rainProg.u.clockTime,time);gl.uniform1f(rainProg.u.loopLength,period);
  gl.uniform2f(rainProg.u.resolution,scene.w,scene.h);bindTexture(0,lightMap);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);
  gl.drawArraysInstanced(gl.TRIANGLES,0,6,2400);
  gl.disable(gl.BLEND);gl.depthMask(true);gl.disable(gl.DEPTH_TEST);
  output(targets.air);cameraUniforms(airProg,c);passLights(airProg);bindTexture(0,scene.depthTex);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.useProgram(bloomProg.p);
  for(let j=0;j<bloom.length;j++){
    const src=j?bloom[j-1]:scene;output(bloom[j]);bindTexture(0,src.t);
    const radius=j?1.42:1.55;gl.uniform2f(bloomProg.u.stepSize,radius/src.w,radius/src.h);
    gl.uniform1f(bloomProg.u.threshold,j?0:1);gl.drawArrays(gl.TRIANGLES,0,3);
  }
  output(null);gl.useProgram(postProg.p);
  [scene,...bloom,targets.air].forEach((t,i)=>bindTexture(i,t.t));
  gl.uniform2f(postProg.u.pixel,1/scene.w,1/scene.h);gl.uniform1f(postProg.u.clockTime,time);gl.drawArrays(gl.TRIANGLES,0,3);
}
const photo=location.hash.match(/^#t=(\d+(?:\.\d+)?)$/);
const coverUniform=new Float32Array(covers.flat());
let time=photo?Number(photo[1])%100000:0,playing=!photo&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
const play=document.querySelector('#play'),full=document.querySelector('#fullscreen');
let hideTimer,drag=null,dirty=true,prev=0,lag=0,frames=0,returnLookAt=0;
function showControls(){
  document.body.classList.remove('quiet');clearTimeout(hideTimer);
  if(playing&&!drag)hideTimer=setTimeout(()=>document.body.classList.add('quiet'),3200);
}
function syncPlay(){
  const label=playing?'Pause walk':'Play walk';play.setAttribute('aria-label',label);play.title=label+' (Space)';
  document.querySelector('#playIcon').setAttribute('d',playing?'M3.5 2.5h3v11h-3zm6 0h3v11h-3z':'M4 2.2l9 5.8-9 5.8z');
  showControls();
}
function toggle(){playing=!playing;prev=0;dirty=true;syncPlay();}
window.addEventListener('hashchange',()=>{
  const stamp=location.hash.match(/^#t=(\d+(?:\.\d+)?)$/);
  if(stamp){time=Number(stamp[1])%100000;playing=false;aimX=aimY=lookX=lookY=0;prev=0;dirty=true;syncPlay();}
});
async function fullscreen(){
  try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){showControls();}
}
play.addEventListener('click',toggle);full.addEventListener('click',fullscreen);
if(!document.fullscreenEnabled)full.hidden=true;
document.addEventListener('fullscreenchange',()=>{const inFull=!!document.fullscreenElement;full.setAttribute('aria-label',inFull?'Exit full screen':'Enter full screen');full.title=(inFull?'Exit full screen':'Full screen')+' (F)';dirty=true;showControls();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)toggle();}
  if(e.code==='KeyF'&&!e.repeat)fullscreen();
  if(e.code==='Escape'){aimX=aimY=0;dirty=true;}
});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:aimX,pitch:aimY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);showControls();});
canvas.addEventListener('pointermove',e=>{
  if(drag&&drag.id===e.pointerId){
    aimX=clamp(drag.yaw-(e.clientX-drag.x)*.0032,-.70,.70);
    aimY=clamp(drag.pitch+(e.clientY-drag.y)*.0028,-.36,.44);dirty=true;
  }showControls();
});
function stopDrag(){drag=null;returnLookAt=performance.now()+2100;showControls();}
canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
document.querySelector('#controls').addEventListener('pointermove',showControls);
document.addEventListener('visibilitychange',()=>{prev=0;dirty=true;});
window.addEventListener('resize',()=>{dirty=true;});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();playing=false;status.textContent='Restoring the alley…';status.hidden=false;});
canvas.addEventListener('webglcontextrestored',()=>location.reload());
function frame(now){
  if(!document.hidden&&!gl.isContextLost()){
    const elapsed=prev?(now-prev)/1000:0;prev=now;
    if(playing)time+=Math.min(elapsed,.16);
    if(playing&&!drag&&returnLookAt&&now>returnLookAt){const f=Math.exp(-2.2*Math.min(elapsed,.18));aimX*=f;aimY*=f;}
    const smoothing=1-Math.exp(-13*Math.min(elapsed||.02,.19));
    lookX=mix(lookX,aimX,smoothing);lookY=mix(lookY,aimY,smoothing);
    if(playing||dirty||Math.abs(lookX-aimX)+Math.abs(lookY-aimY)>.00015){render(time);dirty=false;}
    if(playing&&elapsed>0){
      lag+=Math.min(elapsed,.2);frames++;
      if(frames>=60||(frames>=12&&lag>1.8)){
        const average=lag/frames;
        if(average>.041&&quality>.66)quality=Math.max(.66,quality-.12);
        else if(average<.018&&quality<1)quality=Math.min(1,quality+.045);
        lag=0;frames=0;
      }
    }
  }else prev=0;
  requestAnimationFrame(frame);
}
gl.depthFunc(gl.LEQUAL);
render(time);status.hidden=true;syncPlay();requestAnimationFrame(frame);
} catch(error) {
  console.error(error);status.textContent=error.message||'The scene could not be opened.';
  document.querySelector('#controls').style.display='none';
}
})();
