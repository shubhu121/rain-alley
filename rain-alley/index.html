<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Type colour","default":"#f0eee5"},
    {"id":"color-ground","type":"color","label":"Bars","default":"#000000"},
    {"id":"title","type":"string","label":"Title","default":"雨の横丁"},
    {"id":"place","type":"string","label":"Place line","default":"Shinjuku, Tokyo"},
    {"id":"credit","type":"string","label":"Credit line","default":"A real-time walk · drag to look · space to pause"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>雨の横丁 — Rain Alley</title>
    <style>
      :root {
        --color-ink: #f0eee5;
        --color-ground: #000000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="alley"
        data-composition-id="alley"
        data-composition-src="compositions/alley.html"
        data-start="0"
        data-duration="35"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="35"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <audio
        id="rain"
        src="assets/audio/rain-bed.wav"
        data-start="0"
        data-duration="40"
        data-volume="1"
        data-fade-in="0.8"
        data-fade-out="1.8"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":34.9,"v":1},{"t":35.8,"v":0.71},{"t":38.4,"v":0.71},{"t":39.5,"v":0.92}]}]}'
        data-track-index="2"
      ></audio>
      <audio
        id="hiss"
        src="assets/audio/steam-hiss.mp3"
        data-start="13.95"
        data-duration="2.5"
        data-volume="0.55"
        data-fade-in="0.15"
        data-fade-out="0.7"
        data-track-index="3"
      ></audio>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
